name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read

concurrency:
  group: sanarwa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Circular dependencies
        run: pnpm deps:circular

      - name: Fallow
        run: pnpm fallow

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanarwa
          POSTGRES_PASSWORD: sanarwa
          POSTGRES_DB: sanarwa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanarwa -d sanarwa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://sanarwa:sanarwa@localhost:5432/sanarwa_ci
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @sanarwa/api migration:run

      - name: Revert latest migration
        run: pnpm --filter @sanarwa/api migration:revert

      - name: Re-run migrations
        run: pnpm --filter @sanarwa/api migration:run
