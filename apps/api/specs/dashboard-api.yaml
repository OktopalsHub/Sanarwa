            application/json:
              schema:
                $ref: "#/components/schemas/DashboardPerformanceMetrics"

  /performance/alerts:
    get:
      tags:
        - Performance Monitoring
      summary: Get performance alerts
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: severity
          in: query
          description: Filter by alert severity
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: status
          in: query
          description: Filter by alert status
          schema:
            type: string
            enum: [active, resolved]
        - name: type
          in: query
          description: Filter by alert type
          schema:
            type: string
            enum: [high_response_time, low_throughput, high_error_rate, memory_usage, disk_usage]
      responses:
        "200":
          description: Performance alerts retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPerformanceAlerts"

  /performance/alerts/{alertId}/resolve:
    post:
      tags:
        - Performance Monitoring
      summary: Resolve performance alert
      security:
        - BearerAuth: []
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Alert resolved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceAlert"

  # Root Application Endpoints
  /:
    get:
      tags:
        - Application
      summary: Application root endpoint - health check and basic info
      security: []
      responses:
        "200":
          description: Application information and health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationInfo"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    # QUERY PARAMETERS
    Page:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      description: Search term for filtering results
      schema:
        type: string
    SortBy:
      name: sortBy
      in: query
      description: Field to sort by
      schema:
        type: string
        default: createdAt
    SortOrder:
      name: sortOrder
      in: query
      description: Sort order
      schema:
        type: string
        enum: [ASC, DESC]
        default: DESC
    TenantMemberRoleQuery:
      name: role
      in: query
      description: Filter by member role
      schema:
        $ref: "#/components/schemas/TenantMemberRole"
    ChannelQuery:
      name: channel
      in: query
      description: Filter by notification channel
      schema:
        type: string
    ProviderType:
      name: providerType
      in: query
      description: Filter by provider type
      schema:
        type: string
    IsActiveQuery:
      name: isActive
      in: query
      description: Filter by active status
      schema:
        type: boolean
    OAuthProvider:
      name: provider
      in: path
      required: true
      description: OAuth provider name
      schema:
        type: string
        enum: [google, github, microsoft]

    # PATH PARAMETERS
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConfigId:
      name: configId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BrandId:
      name: brandId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    # Basic Types
    TenantStatus:
      type: string
      enum: [active, inactive, suspended]

    UserRole:
      type: string
      enum: [super_admin, admin, developer, basic]
      description: User role in the system

    UserStatus:
      type: string
      enum: [active, inactive, suspended]
      description: User account status

    AuthProvider:
      type: string
      enum: [local, google, github]
      description: Authentication provider used by the user

    # Pagination Base Schema
    PaginationMeta:
      type: object
      properties:
        name:
          type: string
          description: Name of the paginated resource
          example: "items"
        size:
          type: integer
          description: Number of records in current page
          example: 10
        pageCount:
          type: integer
          description: Total number of pages
          example: 5
        limit:
          type: integer
          description: Number of items per page
          example: 10
        page:
          type: integer
          description: Current page number
          example: 1
        previousPage:
          type: integer
          nullable: true
          description: Previous page number (null if first page)
          example: null
        nextPage:
          type: integer
          nullable: true
          description: Next page number (null if last page)
          example: 2
        totalItems:
          type: integer
          description: Total number of items
          example: 50

    # Authentication Models
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        isActive:
          type: boolean
        role:
          type: string

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User unique identifier
          example: "123e4567-e89b-12d3-a456-426614174000"
        email:
          type: string
          format: email
          description: User email address
          example: "user@example.com"
        firstName:
          type: string
          description: User first name
          example: "John"
        lastName:
          type: string
          description: User last name
          example: "Doe"
        fullName:
          type: string
          description: User full name (computed)
          example: "John Doe"
        role:
          $ref: "#/components/schemas/UserRole"
        isActive:
          type: boolean
          description: Whether the user account is active
          example: true
        avatar:
          type: string
          description: User avatar URL
          example: "https://example.com/avatar.jpg"
        authProvider:
          $ref: "#/components/schemas/AuthProvider"
        createdAt:
          type: string
          format: date-time
          description: User creation timestamp
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: User last update timestamp
          example: "2024-01-01T00:00:00.000Z"

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        status:
          type: string
        authProvider:
          type: string
        avatar:
          type: string
        role:
          type: string

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

    # Tenant Models
    CreateTenantRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string

    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        description:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Tenant Member Models
    UpdateTenantMemberRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/MemberRole"
        isActive:
          type: boolean

    TenantMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
        tenant:
          $ref: "#/components/schemas/Tenant"
        role:
          $ref: "#/components/schemas/MemberRole"
        isActive:
          type: boolean
        joinedAt:
          type: string
          format: date-time

    MemberRole:
      type: string
      enum: [owner, admin, member, viewer]

    TenantMemberResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Tenant member unique identifier
        role:
          $ref: "#/components/schemas/MemberRole"
        status:
          type: string
          enum: [active, inactive, pending]
          description: Member status
        createdAt:
          type: string
          format: date-time
          description: Member creation timestamp
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: User unique identifier
            email:
              type: string
              format: email
              description: User email address
            firstName:
              type: string
              description: User first name
            lastName:
              type: string
              description: User last name
            fullName:
              type: string
              description: User full name (computed)
            avatar:
              type: string
              format: uri
              description: User avatar URL
        tenant:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Tenant unique identifier
            name:
              type: string
              description: Tenant name
            subdomain:
              type: string
              description: Tenant subdomain
            status:
              type: string
              description: Tenant status
            createdAt:
              type: string
              format: date-time
              description: Tenant creation timestamp

    # Invitation Models
    CreateInviteRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/MemberRole"
        message:
          type: string

    Invite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/MemberRole"
        status:
          $ref: "#/components/schemas/InviteStatus"
        message:
          type: string
        invitedBy:
          $ref: "#/components/schemas/User"
        tenant:
          $ref: "#/components/schemas/Tenant"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    InviteStatus:
      type: string
      enum: [pending, accepted, declined, expired]

    AcceptInviteRequest:
      type: object
      required:
        - token
        - firstName
        - lastName
      properties:
        token:
          type: string
          description: The invitation token
        firstName:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name
        password:
          type: string
          minLength: 8
          description: Optional password for email/password authentication. If not provided, user must complete setup via OAuth.

    AcceptInviteResponse:
      type: object
      properties:
        message:
          type: string
          example: "Invitation accepted successfully"
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            firstName:
              type: string
            lastName:
              type: string
            fullName:
              type: string
        tenant:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        membership:
          type: object
          properties:
            role:
              type: string
            joinedAt:
              type: string
              format: date-time

    # Project Models
    CreateProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Brand Models
    CreateBrandRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          description: Brand name
          example: "My Company"
        description:
          type: string
          maxLength: 500
          description: Brand description
          example: "Our primary brand for customer communications"
        domain:
          type: string
          maxLength: 255
          description: Domain for email authentication
          example: "mycompany.com"
        logo:
          type: string
          format: uri
          description: URL to brand logo
          example: "https://cdn.mycompany.com/logo.png"
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Primary brand color (hex format)
          example: "#007bff"
        secondaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Secondary brand color (hex format)
          example: "#6c757d"
        defaultFromEmail:
          type: string
          format: email
          maxLength: 255
          description: Default sender email address
          example: "noreply@mycompany.com"
        defaultFromName:
          type: string
          maxLength: 255
          description: Default sender name
          example: "My Company"
        replyToEmail:
          type: string
          format: email
          maxLength: 255
          description: Reply-to email address
          example: "support@mycompany.com"
        whiteLabelConfig:
          $ref: "#/components/schemas/WhiteLabelConfig"
        emailSettings:
          $ref: "#/components/schemas/EmailSettings"
        smsSettings:
          $ref: "#/components/schemas/SmsSettings"
        socialLinks:
          $ref: "#/components/schemas/SocialLinks"
        metadata:
          type: object
          additionalProperties: true
          description: Custom metadata for the brand

    UpdateBrandRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          description: Brand name
        description:
          type: string
          maxLength: 500
          description: Brand description
        domain:
          type: string
          maxLength: 255
          description: Domain for email authentication
        logo:
          type: string
          format: uri
          description: URL to brand logo
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Primary brand color (hex format)
        secondaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Secondary brand color (hex format)
        defaultFromEmail:
          type: string
          format: email
          maxLength: 255
          description: Default sender email address
        defaultFromName:
          type: string
          maxLength: 255
          description: Default sender name
        replyToEmail:
          type: string
          format: email
          maxLength: 255
          description: Reply-to email address
        status:
          $ref: "#/components/schemas/BrandStatus"
        whiteLabelConfig:
          $ref: "#/components/schemas/WhiteLabelConfig"
        emailSettings:
          $ref: "#/components/schemas/EmailSettings"
        smsSettings:
          $ref: "#/components/schemas/SmsSettings"
        socialLinks:
          $ref: "#/components/schemas/SocialLinks"
        metadata:
          type: object
          additionalProperties: true
          description: Custom metadata for the brand

    Brand:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Brand unique identifier
        name:
          type: string
          description: Brand name
        description:
          type: string
          description: Brand description
        domain:
          type: string
          description: Domain for email authentication
        status:
          $ref: "#/components/schemas/BrandStatus"
        logo:
          type: string
          format: uri
          description: URL to brand logo
        primaryColor:
          type: string
          description: Primary brand color (hex format)
        secondaryColor:
          type: string
          description: Secondary brand color (hex format)
        defaultFromEmail:
          type: string
          format: email
          description: Default sender email address
        defaultFromName:
          type: string
          description: Default sender name
        replyToEmail:
          type: string
          format: email
          description: Reply-to email address
        whiteLabelConfig:
          $ref: "#/components/schemas/WhiteLabelConfig"
        emailSettings:
          $ref: "#/components/schemas/EmailSettings"
        smsSettings:
          $ref: "#/components/schemas/SmsSettings"
        socialLinks:
          $ref: "#/components/schemas/SocialLinks"
        metadata:
          type: object
          additionalProperties: true
          description: Custom metadata for the brand
        tenantId:
          type: string
          format: uuid
          description: Tenant ID this brand belongs to
        createdBy:
          type: string
          format: uuid
          description: ID of the tenant member who created this brand
        createdAt:
          type: string
          format: date-time
          description: Brand creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Brand last update timestamp

    BrandStatus:
      type: string
      enum:
        - active
        - inactive
        - pending_verification
      description: Brand status
      example: "active"

    WhiteLabelConfig:
      type: object
      properties:
        domains:
          type: object
          properties:
            primary:
              type: string
              description: Primary domain
              example: "mycompany.com"
            tracking:
              type: string
              description: Tracking domain
              example: "track.mycompany.com"
            unsubscribe:
              type: string
              description: Unsubscribe domain
              example: "unsubscribe.mycompany.com"
            verified:
              type: boolean
              description: Domain verification status
            verifiedAt:
              type: string
              format: date-time
              description: Domain verification timestamp
            verificationToken:
              type: string
              description: DNS verification token
            lastVerificationAttempt:
              type: string
              format: date-time
              description: Last verification attempt timestamp
            verificationError:
              type: string
              description: Last verification error message
        dkim:
          type: object
          properties:
            selector:
              type: string
              description: DKIM selector
              example: "default"
            privateKey:
              type: string
              description: DKIM private key
            publicKey:
              type: string
              description: DKIM public key
            verified:
              type: boolean
              description: DKIM verification status
            verifiedAt:
              type: string
              format: date-time
              description: DKIM verification timestamp
            lastVerificationAttempt:
              type: string
              format: date-time
              description: Last verification attempt timestamp
            verificationError:
              type: string
              description: Last verification error message
        dmarc:
          type: object
          properties:
            policy:
              type: string
              enum: [none, quarantine, reject]
              description: DMARC policy
              example: "quarantine"
            percentage:
              type: integer
              minimum: 0
              maximum: 100
              description: Policy application percentage
              example: 100
            reportEmail:
              type: string
              format: email
              description: DMARC report email
              example: "dmarc@mycompany.com"
            verified:
              type: boolean
              description: DMARC verification status
            verifiedAt:
              type: string
              format: date-time
              description: DMARC verification timestamp
            lastVerificationAttempt:
              type: string
              format: date-time
              description: Last verification attempt timestamp
            verificationError:
              type: string
              description: Last verification error message
        senderId:
          type: object
          properties:
            domain:
              type: string
              description: Sender ID domain
            verified:
              type: boolean
              description: Sender ID verification status
        ssl:
          type: object
          properties:
            certificate:
              type: string
              description: SSL certificate
            privateKey:
              type: string
              description: SSL private key
            verified:
              type: boolean
              description: SSL verification status

    EmailSettings:
      type: object
      properties:
        signature:
          type: string
          description: Email signature
          example: "Best regards,\nThe My Company Team"
        footerText:
          type: string
          description: Footer text
          example: "© 2024 My Company. All rights reserved."
        unsubscribeText:
          type: string
          description: Unsubscribe text
          example: "Click here to unsubscribe from future emails"
        trackingEnabled:
          type: boolean
          description: Email tracking enabled
          example: true

    SmsSettings:
      type: object
      properties:
        defaultSenderId:
          type: string
          description: Default SMS sender ID
          example: "MyCompany"
        optOutKeywords:
          type: array
          items:
            type: string
          description: SMS opt-out keywords
          example: ["STOP", "UNSUBSCRIBE", "QUIT"]
        optInKeywords:
          type: array
          items:
            type: string
          description: SMS opt-in keywords
          example: ["START", "SUBSCRIBE", "JOIN"]

    SocialLinks:
      type: object
      properties:
        website:
          type: string
          format: uri
          description: Website URL
          example: "https://mycompany.com"
        facebook:
          type: string
          format: uri
          description: Facebook URL
          example: "https://facebook.com/mycompany"
        twitter:
          type: string
          format: uri
          description: Twitter URL
          example: "https://twitter.com/mycompany"
        linkedin:
          type: string
          format: uri
          description: LinkedIn URL
          example: "https://linkedin.com/company/mycompany"
        instagram:
          type: string
          format: uri
          description: Instagram URL
          example: "https://instagram.com/mycompany"

    DomainVerificationInstructions:
      type: object
      properties:
        domain:
          type: string
          description: Domain to be verified
          example: "mycompany.com"
        verificationToken:
          type: string
          description: Verification token to add to DNS
          example: "notifi-verify=abc123def456..."
        instructions:
          type: object
          properties:
            recordType:
              type: string
              description: DNS record type
              example: "TXT"
            name:
              type: string
              description: DNS record name
              example: "_verification.mycompany.com"
            value:
              type: string
              description: DNS record value
              example: "notifi-verify=abc123def456..."
        domainHealth:
          type: object
          properties:
            hasMX:
              type: boolean
              description: Domain has MX records
            hasA:
              type: boolean
              description: Domain has A records
            hasAAAA:
              type: boolean
              description: Domain has AAAA records

    DomainVerificationError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          description: Detailed error message with DNS setup instructions
          example: "Domain verification failed. Please add the following TXT record to your DNS:\nName: _verification.mycompany.com\nValue: notifi-verify=abc123def456...\nError: ENOTFOUND"
        error:
          type: string
          example: "Bad Request"

    DKIMVerificationError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          description: Detailed error message with DKIM setup instructions
          example: "DKIM verification failed for selector \"default\". Please ensure you have added the DKIM DNS record:\nName: default._domainkey.mycompany.com\nError: No valid DKIM record found for selector default"
        error:
          type: string
          example: "Bad Request"

    DMARCVerificationError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
