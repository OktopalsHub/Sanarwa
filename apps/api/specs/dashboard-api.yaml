openapi: 3.0.3
info:
  title: Sanarwa Dashboard API
  description: |
    Internal dashboard API for managing tenants, users, authentication, and platform administration.
    This API is used by the dashboard interface for tenant onboarding, user management, and platform configuration.
  version: 1.0.0
  contact:
    name: API Support
    email: support@sanarwa.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://dashboard-api.sanarwa.com/v1
    description: Production dashboard server
  - url: http://localhost:9000
    description: Development dashboard server

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: OAuth Authentication
    description: OAuth-based authentication with third-party providers
  - name: Users
    description: User profile and account management
  - name: API Keys
    description: Manage API keys for project access
  - name: Tenant Management
    description: Manage tenant accounts and settings
  - name: Tenant Members
    description: Manage tenant members and roles
  - name: Invitations
    description: Send and manage invitations
  - name: Projects
    description: Manage projects within tenants
  - name: Brands
    description: Manage brand configurations and white-labeling
  - name: Templates
    description: Manage notification templates
  - name: Provider Configurations
    description: Manage notification provider configurations
  - name: Messaging
    description: Send and manage messages and notifications
  - name: Analytics
    description: Analytics, reporting, and delivery tracking

  - name: Configuration Management
    description: System and tenant configuration management
  - name: Health & Monitoring
    description: System health checks and performance monitoring
  - name: Security & Audit
    description: Security events and audit log management
  - name: BYOP Management
    description: Bring Your Own Provider configuration and management
  - name: Dead Letter Queue Management
    description: Failed message monitoring and retry management
  - name: In-App Notifications Management
    description: In-app notification system management
  - name: Performance Monitoring
    description: System performance monitoring and alerting
  - name: Application
    description: Root application endpoints and health checks

paths:
  # Tenant Management
  /tenants:
    post:
      tags:
        - Tenant Management
      summary: Create a new tenant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

    get:
      tags:
        - Tenant Management
      summary: Get tenants with pagination and filtering
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortOrder"
        - name: status
          in: query
          description: Filter by tenant status
          schema:
            $ref: "#/components/schemas/TenantStatus"
      responses:
        "200":
          description: Tenants retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTenants"

  /tenants/{tenantId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags:
        - Tenant Management
      summary: Get tenant by ID
      security:
        - BearerAuth: []

      responses:
        "200":
          description: Tenant retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Tenant Management
      summary: Update tenant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: Tenant updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

    delete:
      tags:
        - Tenant Management
      summary: Delete tenant
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Tenant deleted successfully

  /tenants/{tenantId}/suspend:
    post:
      tags:
        - Tenant Management
      summary: Suspend tenant
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant suspended successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/{tenantId}/activate:
    post:
      tags:
        - Tenant Management
      summary: Activate tenant
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant activated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/me:
    get:
      tags:
        - Tenant Management
      summary: Get all tenants that the current user belongs to
      description: |
        Get a paginated list of all tenants that the current user is a member of.
        This endpoint returns tenant membership information including the user's role in each tenant.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          description: Search by tenant name or subdomain
          schema:
            type: string
            example: "acme"
        - name: role
          in: query
          description: Filter by user role in tenant
          schema:
            $ref: "#/components/schemas/TenantMemberRole"
        - name: sortBy
          in: query
          description: Sort field
          schema:
            type: string
            enum: [createdAt, role, tenantName]
            default: createdAt
        - name: sortOrder
          in: query
          description: Sort order
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        "200":
          description: User tenants retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUserTenants"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # Authentication Endpoints
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: User already exists

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logout successful

  /auth/profile:
    get:
      tags:
        - Authentication
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/change-password:
    put:
      tags:
        - Authentication
      summary: Change user password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "204":
          description: Password reset email sent
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset successfully
        "400":
          $ref: "#/components/responses/BadRequest"

  # OAuth Authentication Endpoints
  /auth/oauth/{provider}:
    get:
      tags:
        - OAuth Authentication
      summary: Initiate OAuth login with the specified provider
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      responses:
        "302":
          description: Redirect to OAuth provider authorization URL
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/oauth/{provider}/callback:
    get:
      tags:
        - OAuth Authentication
      summary: OAuth callback URL - handles the OAuth provider response
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - name: code
          in: query
          required: false
          description: Authorization code from OAuth provider
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Error from OAuth provider
          schema:
            type: string
      responses:
        "302":
          description: Redirect to frontend with authentication tokens or error
        "400":
          $ref: "#/components/responses/BadRequest"

  # Tenant Members
  /tenants/{tenantId}/members:
    # post:
    #   tags:
    #     - Tenant Members
    #   summary: Add a member to the tenant
    #   security:
    #     - BearerAuth: []
    #   parameters:
    #     - $ref: "#/components/parameters/TenantId"
    #   requestBody:
    #     required: true
    #     content:
    #       application/json:
    #         schema:
    #           $ref: "#/components/schemas/CreateTenantMemberRequest"
    #   responses:
    #     "201":
    #       description: Member added successfully
    #       content:
    #         application/json:
    #           schema:
    #             $ref: "#/components/schemas/TenantMember"

    get:
      tags:
        - Tenant Members
      summary: Get tenant members with pagination and filtering
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/TenantMemberRoleQuery"
      responses:
        "200":
          description: Members retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTenantMembers"

  /tenants/{tenantId}/members/{memberId}:
    get:
      tags:
        - Tenant Members
      summary: Get a specific tenant member
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: Member retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMember"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Tenant Members
      summary: Update a tenant member
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantMemberRequest"
      responses:
        "200":
          description: Member updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMember"

    delete:
      tags:
        - Tenant Members
      summary: Remove a tenant member
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Member removed successfully

  # Tenant Invitations
  /tenants/{tenantId}/invites:
    post:
      tags:
        - Invitations
      summary: Send an invitation
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Invitation sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"

    get:
      tags:
        - Invitations
      summary: Get tenant invitations with pagination and filtering
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortOrder"
        - name: status
          in: query
          description: Filter by invitation status
          schema:
            $ref: "#/components/schemas/InviteStatus"
      responses:
        "200":
          description: Invitations retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedInvites"

  /tenants/{tenantId}/invites/{inviteId}:
    delete:
      tags:
        - Invitations
      summary: Cancel an invitation
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/InviteId"
      responses:
        "204":
          description: Invitation cancelled successfully

  # Public Invitation Endpoints
  /invites/accept:
    post:
      tags:
        - Invitations
      summary: Accept an invitation
      description: |
        Accept a tenant invitation. Supports two authentication flows:
        1. **Email/Password**: Include a password to create a local account
        2. **OAuth**: Omit password to complete setup via OAuth providers (Google, GitHub)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
            examples:
              email_password:
                summary: Accept with email/password
                value:
                  token: "abc123def456"
                  firstName: "John"
                  lastName: "Doe"
                  password: "securePassword123"
              oauth_flow:
                summary: Accept for OAuth completion
                value:
                  token: "abc123def456"
                  firstName: "John"
                  lastName: "Doe"
      responses:
        "200":
          description: Invitation accepted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInviteResponse"

  /invites/{token}:
    get:
      tags:
        - Invitations
      summary: Get invitation details by token
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"

  /invites/{token}/decline:
    post:
      tags:
        - Invitations
      summary: Decline an invitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Invitation declined successfully

  # Projects
  /tenants/{tenantId}/projects:
    post:
      tags:
        - Projects
      summary: Create a new project
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

    get:
      tags:
        - Projects
      summary: Get tenant projects with pagination and filtering
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Projects retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProjects"

  /tenants/{tenantId}/projects/{projectId}:
    get:
      tags:
        - Projects
      summary: Get a specific project
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Projects
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

    delete:
      tags:
        - Projects
      summary: Delete a project
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project deleted successfully

  # Brands
  /tenants/{tenantId}/brands:
    post:
      tags:
        - Brands
      summary: Create a new brand
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrandRequest"
      responses:
        "201":
          description: Brand created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"

    get:
      tags:
        - Brands
      summary: Get tenant brands with pagination and filtering
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Brands retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBrands"

  /tenants/{tenantId}/brands/{brandId}:
    get:
      tags:
        - Brands
      summary: Get a specific brand
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BrandId"
      responses:
        "200":
          description: Brand retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"

    patch:
      tags:
        - Brands
      summary: Update a brand
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BrandId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBrandRequest"
      responses:
        "200":
          description: Brand updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"

    delete:
      tags:
        - Brands
      summary: Delete a brand
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BrandId"
      responses:
        "204":
          description: Brand deleted successfully

  /tenants/{tenantId}/brands/{brandId}/domain-verification-instructions:
    get:
      tags:
        - Brands
      summary: Get domain verification instructions
      description: |
        Get DNS setup instructions for domain verification. This endpoint provides the verification token
        and DNS record details needed to verify domain ownership.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BrandId"
        - name: domain
          in: query
          description: Domain to verify (optional if already set in brand)
          schema:
            type: string
            format: hostname
            example: "mycompany.com"
      responses:
        "200":
          description: Domain verification instructions retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerificationInstructions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/brands/{brandId}/verify-domain:
    post:
      tags:
        - Brands
      summary: Verify domain ownership
      description: |
        Perform actual DNS verification for domain ownership. This endpoint performs real DNS lookups
        to verify that the required TXT record has been added to the domain's DNS configuration.

        **Prerequisites:**
        - `defaultFromEmail` must be set
        - `defaultFromName` must be set
        - Email domain must match the domain being verified
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BrandId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                  format: hostname
                  description: Domain to verify
                  example: "mycompany.com"
              required:
                - domain
      responses:
        "200":
          description: Domain verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          description: Domain verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerificationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/brands/{brandId}/verify-dkim:
    post:
      tags:
        - Brands
      summary: Verify DKIM configuration
      description: |
        Perform actual DNS verification for DKIM configuration. This endpoint performs real DNS lookups
        to verify that the DKIM DNS record has been properly configured.

        **Prerequisites:**
        - Domain must be verified first
        - `defaultFromEmail` must be set and match the domain
        - `defaultFromName` must be set
        - DKIM DNS record must be configured
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BrandId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                selector:
                  type: string
                  description: DKIM selector
                  default: "default"
                  example: "default"
      responses:
        "200":
          description: DKIM verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          description: DKIM verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DKIMVerificationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/brands/{brandId}/verify-dmarc:
    post:
      tags:
        - Brands
      summary: Verify DMARC configuration
      description: |
        Perform actual DNS verification for DMARC configuration. This endpoint performs real DNS lookups
        to verify that the DMARC DNS record has been properly configured.

        **Prerequisites:**
        - Domain must be verified first
        - `defaultFromEmail` must be set and match the domain
        - `defaultFromName` must be set
        - DMARC DNS record must be configured
      security:
        - BearerAuth: []
