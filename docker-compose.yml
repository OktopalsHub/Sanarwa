services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sanarwa
      POSTGRES_PASSWORD: sanarwa
      POSTGRES_DB: sanarwa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanarwa -d sanarwa_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "9010:9000"
    environment:
      NODE_ENV: development
      PORT: 9000
      DATABASE_URL: postgresql://sanarwa:sanarwa@postgres:5432/sanarwa_db
      REDIS_URL: redis://redis:6379
      JWT_AUTH_SECRET: local-dev-jwt-access-secret-at-least-32-chars
      JWT_REFRESH_SECRET: local-dev-jwt-refresh-secret-at-least-32-chars
      PROVIDER_ENCRYPTION_KEY: local-dev-provider-encryption-key-32chars
      SESSION_SECRET: local-dev-session-secret-at-least-32chars
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:9010/api/v1
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:9010/api/v1
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
